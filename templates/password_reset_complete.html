{% extends "layout.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card text-center">
        <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-4" style="width: 80px; height: 80px;">
            <i class="bi bi-check-circle fs-1"></i>
        </div>
        <h3 class="fw-bold text-navy mb-3">Password Reset Complete</h3>
        <p class="text-muted mb-4">Your password has been set. You may go ahead and log in now.</p>
        <a href="{% url 'login' %}" class="btn btn-primary px-4">Log in</a>
    </div>
</div>
{% endblock %}
